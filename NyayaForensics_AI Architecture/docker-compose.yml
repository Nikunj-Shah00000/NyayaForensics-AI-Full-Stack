services:
 postgres:
  image: postgres:16
  environment: {POSTGRES_USER: nyaya, POSTGRES_PASSWORD: nyaya, POSTGRES_DB: nyaya}
  ports: ["5432:5432"]
  volumes: [postgres_data:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
  ports: ["6379:6379"]
 neo4j:
  image: neo4j:5-community
  environment: {NEO4J_AUTH: neo4j/nyaya_password}
  ports: ["7474:7474","7687:7687"]
  volumes: [neo4j_data:/data]
 backend:
  build: ./backend
  environment: {DATABASE_URL: postgresql+psycopg2://nyaya:nyaya@postgres:5432/nyaya, NEO4J_URI: bolt://neo4j:7687, NEO4J_USER: neo4j, NEO4J_PASSWORD: nyaya_password, UPLOAD_DIR: /app/storage/evidence}
  ports: ["8000:8000"]
  depends_on: [postgres,redis,neo4j]
  volumes: [evidence_data:/app/storage/evidence]
 frontend:
  build: ./frontend
  environment: {VITE_API_URL: http://localhost:8000}
  ports: ["5173:5173"]
  depends_on: [backend]
volumes: {postgres_data: {}, neo4j_data: {}, evidence_data: {}}
